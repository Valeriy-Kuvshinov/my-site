name: Frontend Deployment Workflow For Production

concurrency:
    group: frontend-prod-deploy
    cancel-in-progress: false

# Redeploy in the following events:
on:
    # After pushing software modifications to the main branch
    push:
        branches:
            - main

    # When manual executions are triggered
    workflow_dispatch:

jobs:
    build-and-ship:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code Repository
              uses: actions/checkout@v4

            - name: Initialize Node.js Development Environment
              uses: actions/setup-node@v4
              with:
                  node-version-file: "frontend/.nvmrc"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Resolve Frontend Dependency Tree
              working-directory: ./frontend
              run: npm ci

            # Bypass Cloudflare
            - name: Bypass Cloudflare for GitHub Action
              uses: xiaotianxt/bypass-cloudflare-for-github-action@v2.1.0
              with:
                  cf_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  cf_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
                  cf_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  disable_bot_fight_mode: "true"

            # Delay Build
            - name: Await Edge Network Propagation
              run: sleep 15

            - name: Compile Angular Static Infrastructure
              working-directory: ./frontend
              run: npm run build

            - name: Inject Secure Host Authentication Key
              uses: shimataro/ssh-key-action@v2
              with:
                  key: ${{ secrets.VPS_SSH_KEY }}
                  known_hosts: ${{ secrets.VPS_KNOWN_HOSTS }}

            - name: Deploy Static Build Atomically to AWS VPS
              run: |
                  RELEASE_ID="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
                  REMOTE_BASE="~/kuv-backend/site"
                  REMOTE_RELEASE="$REMOTE_BASE/releases/$RELEASE_ID"

                  ssh ubuntu@${{ secrets.VPS_IP }} "mkdir -p $REMOTE_RELEASE"
                  rsync -avz -e "ssh" ./backend/out/ ubuntu@${{ secrets.VPS_IP }}:$REMOTE_RELEASE/

                  ssh ubuntu@${{ secrets.VPS_IP }} "
                    cd $REMOTE_BASE &&
                    ln -sfn releases/$RELEASE_ID current.tmp &&
                    mv -Tf current.tmp current &&
                    ls -1dt releases/* | tail -n +4 | xargs -r rm -rf
                  "