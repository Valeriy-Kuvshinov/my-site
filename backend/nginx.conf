# HTTP to HTTPS Redirect & Certbot Challenge
server {
    listen 80;
    server_name vkfreelancesoftware.com www.vkfreelancesoftware.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name vkfreelancesoftware.com www.vkfreelancesoftware.com;

    client_max_body_size 60M; # Enforce maximum upload limit

    # SSL
    ssl_certificate /etc/letsencrypt/live/vkfreelancesoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkfreelancesoftware.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # SECURITY HEADERS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self' https://res.cloudinary.com; frame-src 'self' https://challenges.cloudflare.com https://www.youtube.com https://*.r2.dev; connect-src 'self' https://api.github.com https://vkfreelancesoftware.com https://cloudflareinsights.com https://www.google-analytics.com https://stats.g.doubleclick.net https://www.google.com/g/collect https://analytics.google.com;" always;

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "msie6";

    # Cache Static Assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|avif|webp|svg|woff2?|ttf|eot|webm|mp4)$ {
        root /usr/share/nginx/html;
        expires 1y;

        add_header Cache-Control "public, max-age=31536000, immutable";

        access_log off;
    }

    # Deny access to hidden files/directories (except Let's Encrypt validation)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive configuration files
    location ~* \.(env|git|ini|yml|yaml|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block PHP and WordPress scanner requests
    location ~* \.(php|php[34578]|phtml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        try_files $uri $uri/ /404.html;
    }

    location /api/ {
        proxy_pass http://backend:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    }
}