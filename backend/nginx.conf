# Catch all HTTP traffic and redirect strictly to HTTPS non-www
server {
    listen 80;
    server_name kuvware.com www.kuvware.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kuvware.com$request_uri;
    }
}

# Catch HTTPS WWW traffic and redirect to HTTPS non-www
server {
    listen 443 ssl;
    http2 on;
    server_name www.kuvware.com;

    ssl_certificate /etc/letsencrypt/live/kuvware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuvware.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://kuvware.com$request_uri;
}

# Main Application Server (Strictly non-www)
server {
    listen 443 ssl;
    http2 on;
    server_name kuvware.com;

    root /usr/share/nginx/site/current;
    index index.html;
    client_max_body_size 10M;

    # SSL
    ssl_certificate /etc/letsencrypt/live/kuvware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kuvware.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # SECURITY HEADERS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://res.cloudinary.com https://www.google-analytics.com https://www.googletagmanager.com; media-src 'self' https://res.cloudinary.com; frame-src 'self' https://challenges.cloudflare.com https://www.youtube.com https://*.r2.dev; connect-src 'self' https://api.github.com https://kuvware.com https://cloudflareinsights.com https://www.google-analytics.com https://stats.g.doubleclick.net https://www.google.com/g/collect https://analytics.google.com;" always;

    # Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "msie6";

    # Cache Static Assets (keeps server-level security headers intact)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|avif|webp|svg|woff2?|ttf|eot|webm|mp4)$ {
        expires 1y;
        access_log off;
    }

    # Deny access to hidden files/directories (except Let's Encrypt validation)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive configuration files
    location ~* \.(env|git|ini|yml|yaml|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block PHP and WordPress scanner requests
    location ~* \.(php|php[34578]|phtml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Russian routing
    location /ru/ {
        try_files $uri $uri/ /ru/index.html;
    }

    # Hebrew routing
    location /he/ {
        try_files $uri $uri/ /he/index.html;
    }

    # English (Root) routing - Catches everything else
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}