services:
    backend:
        image: vk-backend:latest
        restart: unless-stopped
        env_file: .env
        deploy:
            resources:
                limits:
                    memory: 512M
        volumes:
            - ./.env:/app/.env:ro
        logging:
            driver: "json-file"
            options:
                max-size: "50m"
                max-file: "3"

    nginx:
        image: nginx:stable-alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./out:/usr/share/nginx/html:ro
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        depends_on:
            - backend
        logging:
            driver: "json-file"
            options:
                max-size: "50m"
                max-file: "3"

    certbot:
        image: certbot/certbot
        volumes:
            - ./certbot/conf:/etc/letsencrypt
            - ./certbot/www:/var/www/certbot
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
