<app-screen-reader-announcer></app-screen-reader-announcer>

<a
	href="#main-content"
	class="skip-link absolute flex full-center">
	<span class="text-center">Skip to main content</span>
</a>
<a
	href="#site-footer"
	class="skip-link absolute flex full-center">
	<span class="text-center">Skip to footer</span>
</a>

<app-a11y-menu></app-a11y-menu>

@if (showBackToTop()) {
<a
	href="#main-content"
	(click)="scrollToTarget('main-content', $event)"
	class="back-to-top flex full-center fast-trans fixed z-15"
	aria-label="Scroll back to main content">
	<app-svg-icon
		icon="arrow"
		width="32"
		height="32">
	</app-svg-icon>
</a>
}

<app-system-message></app-system-message>

<app-aside-menu></app-aside-menu>
<app-cookie-banner></app-cookie-banner>

<header app-header></header>

<router-outlet />
<app-image-modal></app-image-modal>

<footer app-footer></footer>
