<div class="content grid w-full full-center layout-row">
	<nav
		class="site-nav flex flex-row flex-wrap gap-2"
		i18n-aria-label="@@nav.footer.aria"
		aria-label="Footer">
		<a
			routerLink="/"
			routerLinkActive="active"
			[routerLinkActiveOptions]="{ exact: true }"
			ariaCurrentWhenActive="page">
			<span i18n="@@nav.link.home">Home</span>
		</a>
		<a
			routerLink="/portfolio"
			routerLinkActive="active"
			ariaCurrentWhenActive="page">
			<span i18n="@@nav.link.portfolio">Portfolio</span>
		</a>
		<a
			routerLink="/services"
			routerLinkActive="active"
			ariaCurrentWhenActive="page">
			<span i18n="@@nav.link.services">Services</span>
		</a>
		<a
			routerLink="/about"
			routerLinkActive="active"
			ariaCurrentWhenActive="page">
			<span i18n="@@nav.link.about">About</span>
		</a>
		<a
			routerLink="/contact"
			routerLinkActive="active"
			ariaCurrentWhenActive="page">
			<span i18n="@@nav.link.contact">Contact</span>
		</a>
	</nav>

	@if (!isDesktop()) {
	<hr
		class="mobile-separator w-full"
		aria-hidden="true" />
	}

	<nav
		class="social-nav flex flex-row flex-wrap gap-4"
		i18n-aria-label="@@nav.social.aria"
		aria-label="Social profiles">
		@for (social of socials; track social.name) {
		<a
			[href]="social.url"
			target="_blank"
			rel="noopener noreferrer"
			[attr.aria-label]="social.ariaLabel"
			class="flex full-center">
			<app-svg-icon
				[icon]="social.icon"
				width="24"
				height="24">
			</app-svg-icon>
		</a>
		}
	</nav>

	<div class="legal flex items-center w-full">
		<p>&copy; 2024 - 2026 Kuvshinov Software</p>

		<nav class="legal-nav flex flex-row justify-center gap-4">
			<a
				routerLink="/privacy-policy"
				routerLinkActive="active"
				ariaCurrentWhenActive="page">
				<span i18n="@@nav.link.privacy">Privacy</span>
			</a>
			<a
				routerLink="/accessibility"
				routerLinkActive="active"
				ariaCurrentWhenActive="page">
				<span i18n="@@nav.link.accessibility">Accessibility</span>
			</a>
			<a
				routerLink="/terms"
				routerLinkActive="active"
				ariaCurrentWhenActive="page">
				<span i18n="@@nav.link.terms">Terms</span>
			</a>
		</nav>
	</div>
</div>
