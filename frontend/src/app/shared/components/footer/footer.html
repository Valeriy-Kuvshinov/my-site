<div class="content grid w-full full-center layout-row">
	<nav
		class="site-nav flex flex-row flex-wrap gap-2"
		aria-label="Footer navigation">
		<a
			routerLink="/"
			routerLinkActive="active"
			[routerLinkActiveOptions]="{ exact: true }"
			ariaCurrentWhenActive="page">
			<span>Home</span>
		</a>
		<a
			routerLink="/portfolio"
			routerLinkActive="active"
			ariaCurrentWhenActive="page">
			<span>Portfolio</span>
		</a>
		<a
			routerLink="/services"
			routerLinkActive="active"
			ariaCurrentWhenActive="page">
			<span>Services</span>
		</a>
		<a
			routerLink="/about"
			routerLinkActive="active"
			ariaCurrentWhenActive="page">
			<span>About</span>
		</a>
		<a
			routerLink="/contact"
			routerLinkActive="active"
			ariaCurrentWhenActive="page">
			<span>Contact</span>
		</a>
	</nav>

	@if (!isDesktop()) {
	<hr class="mobile-separator w-full" />
	}

	<nav
		class="social-nav flex flex-row flex-wrap gap-4"
		aria-label="Social profiles">
		@for (social of socials; track social.name) {
		<a
			[href]="social.url"
			target="_blank"
			rel="noopener noreferrer"
			[attr.aria-label]="social.ariaLabel"
			class="flex full-center">
			<app-svg-icon
				[icon]="social.icon"
				width="24"
				height="24">
			</app-svg-icon>
		</a>
		}
	</nav>

	<div class="copyright flex items-center w-full">
		<p class="m-0">&copy; 2024 - 2026 Kuvshinov Software.</p>

		<div class="legal-links flex flex-row justify-center gap-4">
			<a
				routerLink="/privacy-policy"
				routerLinkActive="active"
				ariaCurrentWhenActive="page">
				<span>Privacy</span>
			</a>
			<a
				routerLink="/accessibility"
				routerLinkActive="active"
				ariaCurrentWhenActive="page">
				<span>Accessibility</span>
			</a>
			<a
				routerLink="/terms"
				routerLinkActive="active"
				ariaCurrentWhenActive="page">
				<span>Terms</span>
			</a>
		</div>
	</div>
</div>
