@if (isOpen()) {
<article class="modal-wrapper flex flex-col full-center fixed full z-15">
	<div
		#modalRef
		class="image-modal flex column relative"
		[class.has-scroll]="hasScrollbar()"
		role="dialog"
		aria-modal="true"
		i18n-aria-label="@@image_modal.dialog.aria"
		aria-label="selected image showcase modal"
		[appFocusTrap]="true"
		(appClickOutside)="closeImageModal()">
		@if (imageSrc()) {
		<app-image-container
			[src]="imageSrc()!"
			[objectFit]="objectFit()"
			[style.aspect-ratio]="aspectRatio()"
			class="flex full-center w-h-full">
		</app-image-container>
		}

		<button
			#closeBtn
			class="flex absolute z-1"
			i18n-aria-label="@@image_modal.close.aria"
			aria-label="Close image modal"
			(click)="closeImageModal()">
			<app-svg-icon
				icon="close"
				width="32"
				height="32">
			</app-svg-icon>
		</button>
	</div>
</article>
}
