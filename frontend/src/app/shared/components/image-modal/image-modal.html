@if (isOpen()) {
<article class="modal-wrapper flex full-center fixed full z-15">
	<div
		class="image-modal flex column relative w-h-fit"
		role="dialog"
		aria-modal="true"
		aria-label="selected image showcase modal"
		[appFocusTrap]="true"
		(appClickOutside)="closeImageModal()">
		@if (modalValue()) {
		<app-image-container
			[src]="modalValue()!"
			alt=""
			[width]="300"
			[height]="300">
		</app-image-container>
		}

		<button
			#closeBtn
			class="flex absolute z-1"
			aria-label="Close image modal"
			(click)="closeImageModal()">
			<app-svg-icon
				icon="close"
				width="32"
				height="32">
			</app-svg-icon>
		</button>
	</div>
</article>
}
