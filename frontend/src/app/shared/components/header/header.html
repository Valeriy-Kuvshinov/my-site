@let user = authService.currentUser();

@if (user) {
<div class="admin-bar flex flex-row full-center gap-8 w-full">
	<div class="user-info flex flex-row items-center gap-2">
		<app-svg-icon
			icon="person"
			width="16"
			height="16">
		</app-svg-icon>
		<span>{{ user.email }}</span>
	</div>

	<div class="actions flex flex-row items-center gap-8">
		<a
			routerLink="/admin/"
			class="flex flex-row"
			i18n="@@nav.link.admin">
			Admin
		</a>
		<button
			class="flex flex-row"
			[disabled]="authService.isLoggingIn()"
			(click)="handleLogout()">
			<span i18n="@@nav.link.logout">Logout</span>
		</button>
	</div>
</div>
}
<!--  -->
@if (isMobile()) {
<nav
	class="mobile-view flex flex-row items-center justify-between"
	i18n-aria-label="@@nav.mobile.aria"
	aria-label="Mobile Main">
	<button
		(click)="openMenu()"
		i18n-aria-label="@@nav.mobile.open.aria"
		aria-label="Open navigation menu"
		class="w-fit">
		<app-svg-icon
			icon="menu"
			width="32"
			height="32">
		</app-svg-icon>
	</button>

	<a
		routerLink="/"
		routerLinkActive="active"
		[routerLinkActiveOptions]="{ exact: true }"
		ariaCurrentWhenActive="page"
		class="logo flex fast-trans">
		<app-image-container
			src="/images/logo.avif"
			alt="Kuvware logo"
			[width]="60"
			[height]="50"
			[priority]="true">
		</app-image-container>
	</a>
</nav>
}
<!--  -->
@else {
<nav
	class="desktop-view flex flex-row items-center justify-between layout-row"
	i18n-aria-label="@@nav.desktop.aria"
	aria-label="Desktop Main">
	<a
		routerLink="/"
		routerLinkActive="active"
		[routerLinkActiveOptions]="{ exact: true }"
		ariaCurrentWhenActive="page"
		class="logo flex fast-trans">
		<app-image-container
			src="/images/logo.avif"
			alt="Kuvware logo"
			[width]="60"
			[height]="50"
			[priority]="true">
		</app-image-container>
	</a>

	<div class="links flex row gap-12">
		<a
			routerLink="/portfolio/"
			routerLinkActive="active"
			ariaCurrentWhenActive="page"
			i18n="@@nav.link.portfolio"
			class="relative fast-trans">
			Portfolio
		</a>
		<a
			routerLink="/services/"
			routerLinkActive="active"
			ariaCurrentWhenActive="page"
			i18n="@@nav.link.services"
			class="relative fast-trans">
			Services
		</a>
		<a
			routerLink="/about/"
			routerLinkActive="active"
			ariaCurrentWhenActive="page"
			i18n="@@nav.link.about"
			class="relative fast-trans">
			About
		</a>
		<a
			routerLink="/contact/"
			routerLinkActive="active"
			ariaCurrentWhenActive="page"
			i18n="@@nav.link.contact"
			class="relative fast-trans">
			Contact
		</a>
	</div>

	<app-language-select></app-language-select>
</nav>
}
