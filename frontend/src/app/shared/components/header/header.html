@if (store.deviceType() !== 'desktop') {
<nav class="mobile-view grid items-center">
	<button
		(click)="openMenu()"
		aria-label="Open user menu"
		class="w-fit">
		<app-svg-icon
			icon="menu"
			width="32"
			height="32"></app-svg-icon>
	</button>

	<a
		routerLink="/"
		routerLinkActive="active"
		[routerLinkActiveOptions]="{ exact: true }"
		ariaCurrentWhenActive="page"
		class="logo flex fast-trans">
		<app-image-container
			[src]="LOGO_IMG"
			alt="Noffty logo"
			[width]="56"
			[height]="56"
			[priority]="true"
			className="!bg-transparent">
		</app-image-container>
	</a>
</nav>
} @else {
<nav class="desktop-view flex flex-row align-center justify-between layout-row">
	<a
		routerLink="/about"
		routerLinkActive="active"
		ariaCurrentWhenActive="page"
		class="relative fast-trans">
		<span>About</span>
	</a>
	<a
		routerLink="/contact"
		routerLinkActive="active"
		ariaCurrentWhenActive="page"
		class="relative fast-trans">
		<span>Contact</span>
	</a>
	<a
		routerLink="/"
		routerLinkActive="active"
		[routerLinkActiveOptions]="{ exact: true }"
		ariaCurrentWhenActive="page"
		class="logo flex fast-trans">
		<app-image-container
			[src]="LOGO_IMG"
			alt="Noffty logo"
			[width]="54"
			[height]="54"
			[priority]="true"
			className="!bg-transparent">
		</app-image-container>
	</a>
	<a
		routerLink="/portfolio"
		routerLinkActive="active"
		ariaCurrentWhenActive="page"
		class="relative fast-trans">
		<span>Portfolio</span>
	</a>
	<a
		routerLink="/services"
		routerLinkActive="active"
		ariaCurrentWhenActive="page"
		class="relative fast-trans">
		<span>Services</span>
	</a>
</nav>
}
