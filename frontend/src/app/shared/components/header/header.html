@if (store.deviceType() !== 'desktop') {
<nav class="mobile-view flex items-center justify-between p-4 max-w-7xl mx-auto">
	<button
		(click)="openMenu()"
		aria-label="Open user menu"
		class="p-2">
		<app-svg-icon icon="menu"></app-svg-icon>
	</button>

	<app-nav-link
		href="/"
		label="Home"
		[isLogo]="true"
		[exact]="true"
		className="flex shrink-0">
		<app-image-container
			[src]="LOGO_IMG"
			alt="Noffty logo"
			[width]="56"
			[height]="56"
			[priority]="true">
		</app-image-container>
	</app-nav-link>

	<div class="w-10 h-10 bg-slate-600 rounded-full"></div>
</nav>
} @else {
<nav class="desktop-view flex flex-row items-center justify-center gap-8 p-4 max-w-7xl mx-auto">
	<app-nav-link
		href="/portfolio"
		label="Portfolio"></app-nav-link>
	<app-nav-link
		href="/reviews"
		label="Reviews"></app-nav-link>

	<app-nav-link
		href="/"
		label="Home"
		[isLogo]="true"
		[exact]="true"
		className="flex shrink-0 mx-4">
		<app-image-container
			[src]="LOGO_IMG"
			alt="Noffty logo"
			[width]="64"
			[height]="64"
			[priority]="true">
		</app-image-container>
	</app-nav-link>

	<app-nav-link
		href="/about"
		label="About"></app-nav-link>
	<app-nav-link
		href="/contact"
		label="Contact"></app-nav-link>
</nav>
}
