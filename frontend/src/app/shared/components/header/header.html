@if (isMobile()) {
<nav
	class="mobile-view flex flex-row items-center justify-between"
	i18n-aria-label="@@header.nav.mobile.aria"
	aria-label="Mobile Main">
	<button
		(click)="openMenu()"
		i18n-aria-label="@@header.menu.open.aria"
		aria-label="Open navigation menu"
		class="w-fit">
		<app-svg-icon
			icon="menu"
			width="32"
			height="32">
		</app-svg-icon>
	</button>

	<a
		routerLink="/"
		routerLinkActive="active"
		[routerLinkActiveOptions]="{ exact: true }"
		ariaCurrentWhenActive="page"
		class="logo flex fast-trans">
		<app-image-container
			src="/images/logo.avif"
			i18n-alt="@@header.logo.alt"
			alt="Kuvware logo"
			[width]="56"
			[height]="46"
			[priority]="true">
		</app-image-container>
	</a>
</nav>
} @else {
<nav
	class="desktop-view flex flex-row items-center justify-between layout-row"
	i18n-aria-label="@@header.nav.desktop.aria"
	aria-label="Desktop Main">
	<a
		routerLink="/"
		routerLinkActive="active"
		[routerLinkActiveOptions]="{ exact: true }"
		ariaCurrentWhenActive="page"
		class="logo flex fast-trans">
		<app-image-container
			src="/images/logo.avif"
			i18n-alt="@@header.logo.alt"
			alt="Kuvware logo"
			[width]="56"
			[height]="46"
			[priority]="true">
		</app-image-container>
	</a>

	<div class="links flex row gap-12">
		<a
			routerLink="/portfolio/"
			routerLinkActive="active"
			ariaCurrentWhenActive="page"
			i18n="@@header.link.portfolio"
			class="relative fast-trans">
			Portfolio
		</a>
		<a
			routerLink="/services/"
			routerLinkActive="active"
			ariaCurrentWhenActive="page"
			i18n="@@header.link.services"
			class="relative fast-trans">
			Services
		</a>
		<a
			routerLink="/about/"
			routerLinkActive="active"
			ariaCurrentWhenActive="page"
			i18n="@@header.link.about"
			class="relative fast-trans">
			About
		</a>
		<a
			routerLink="/contact/"
			routerLinkActive="active"
			ariaCurrentWhenActive="page"
			i18n="@@header.link.contact"
			class="relative fast-trans">
			Contact
		</a>
	</div>

	<app-language-select></app-language-select>
</nav>
}
