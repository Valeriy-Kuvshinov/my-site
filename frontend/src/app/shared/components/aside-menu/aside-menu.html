@if (isOpen()) {
<div
	class="modal-wrapper fixed full w-h-full z-20"
	role="dialog"
	aria-modal="true">
	<aside
		#asideRef
		appClickOutside
		(appClickOutside)="closeAsideMenu()"
		[appFocusTrap]="true"
		class="aside-menu flex flex-col h-full fast-trans"
		[class.show]="showMenu()"
		aria-label="Mobile user menu"
		tabindex="-1">
		<div class="menu-header flex flex-row items-center">
			<a
				routerLink="/"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ exact: true }"
				ariaCurrentWhenActive="page"
				class="fast-trans"
				(click)="closeAsideMenu()">
				<app-image-container
					[src]="LOGO_IMG"
					alt="Noffty logo"
					[width]="56"
					[height]="46"
					[priority]="true">
				</app-image-container>
			</a>
		</div>

		<nav class="flex flex-col">
			<a
				routerLink="/"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ exact: true }"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center fast-trans"
				(click)="closeAsideMenu()">
				<app-svg-icon
					icon="home"
					width="24"
					height="24"></app-svg-icon>
				<span>Home</span>
			</a>
			<a
				routerLink="/portfolio/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center fast-trans"
				(click)="closeAsideMenu()">
				<app-svg-icon
					icon="briefcase"
					width="24"
					height="24"></app-svg-icon>
				<span>Portfolio</span>
			</a>
			<a
				routerLink="/services/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center fast-trans"
				(click)="closeAsideMenu()">
				<app-svg-icon
					icon="monitor"
					width="24"
					height="24"></app-svg-icon>
				<span>Services</span>
			</a>
			<a
				routerLink="/about/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center fast-trans"
				(click)="closeAsideMenu()">
				<app-svg-icon
					icon="info"
					width="24"
					height="24"></app-svg-icon>
				<span>About</span>
			</a>
			<a
				routerLink="/contact/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center fast-trans"
				(click)="closeAsideMenu()">
				<app-svg-icon
					icon="mail"
					width="24"
					height="24"></app-svg-icon>
				<span>Contact</span>
			</a>
		</nav>
	</aside>
</div>
}
