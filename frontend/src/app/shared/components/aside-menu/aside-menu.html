@if (isOpen()) {
<div
	class="modal-wrapper fixed full w-h-full z-20"
	role="dialog"
	aria-modal="true">
	<aside
		#asideRef
		appClickOutside
		(appClickOutside)="closeAsideMenu()"
		[appFocusTrap]="true"
		class="aside-menu flex flex-col h-full fast-trans"
		[class.show]="showMenu()"
		i18n-aria-label="@@aside.menu.aria"
		aria-label="Mobile user menu"
		tabindex="-1">
		<div class="menu-header flex flex-row items-center justify-between">
			<a
				routerLink="/"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ exact: true }"
				ariaCurrentWhenActive="page"
				class="fast-trans"
				(click)="closeAsideMenu()">
				<app-image-container
					[src]="LOGO_IMG"
					i18n-alt="@@aside.logo.alt"
					alt="Kuvware logo"
					[width]="56"
					[height]="46"
					[priority]="true">
				</app-image-container>
			</a>
			<button
				(click)="closeAsideMenu()"
				i18n-aria-label="@@aside.close.aria"
				aria-label="close menu">
				<app-svg-icon
					icon="close"
					width="24"
					height="24">
				</app-svg-icon>
			</button>
		</div>

		<nav class="flex flex-col">
			<a
				routerLink="/"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ exact: true }"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center gap-4"
				(click)="closeAsideMenu()">
				<app-svg-icon
					icon="home"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@aside.link.home">Home</span>
			</a>
			<a
				routerLink="/portfolio/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center gap-4"
				(click)="closeAsideMenu()">
				<app-svg-icon
					icon="briefcase"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@aside.link.portfolio">Portfolio</span>
			</a>
			<a
				routerLink="/services/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center gap-4"
				(click)="closeAsideMenu()">
				<app-svg-icon
					icon="monitor"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@aside.link.services">Services</span>
			</a>
			<a
				routerLink="/about/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center gap-4"
				(click)="closeAsideMenu()">
				<app-svg-icon
					icon="info"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@aside.link.about">About</span>
			</a>
			<a
				routerLink="/contact/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center gap-4"
				(click)="closeAsideMenu()">
				<app-svg-icon
					icon="mail"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@aside.link.contact">Contact</span>
			</a>
		</nav>

		<div class="menu-footer flex flex-col">
			<app-language-select position="up"></app-language-select>
		</div>
	</aside>
</div>
}
