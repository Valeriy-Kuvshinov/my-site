@if (isOpen()) {
<div
	class="modal-wrapper fixed full w-h-full z-20"
	role="dialog"
	aria-modal="true">
	<aside
		#asideRef
		appClickOutside
		(appClickOutside)="closeAsideMenu()"
		[appFocusTrap]="true"
		class="aside-menu flex flex-col h-full fast-trans"
		[class.show]="showMenu()"
		i18n-aria-label="@@nav.aside.aria"
		aria-label="Mobile navigation menu"
		tabindex="-1">
		<div class="menu-header flex flex-row items-center justify-between">
			<a
				routerLink="/"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ exact: true }"
				ariaCurrentWhenActive="page"
				(click)="closeAsideMenu()">
				<app-image-container
					[src]="LOGO_IMG"
					alt="Kuvware logo"
					[width]="50"
					[height]="40"
					[priority]="true">
				</app-image-container>
			</a>
			<button
				(click)="closeAsideMenu()"
				i18n-aria-label="@@nav.aside.close.aria"
				aria-label="close menu">
				<app-svg-icon
					icon="close"
					width="24"
					height="24">
				</app-svg-icon>
			</button>
		</div>

		<nav
			class="flex flex-col"
			(click)="handleNavClick($event)">
			<a
				routerLink="/"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ exact: true }"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center gap-4">
				<app-svg-icon
					icon="home"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@nav.link.home">Home</span>
			</a>
			<a
				routerLink="/portfolio/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center gap-4">
				<app-svg-icon
					icon="briefcase"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@nav.link.portfolio">Portfolio</span>
			</a>
			<a
				routerLink="/services/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center gap-4">
				<app-svg-icon
					icon="monitor"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@nav.link.services">Services</span>
			</a>
			<a
				routerLink="/about/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center gap-4">
				<app-svg-icon
					icon="info"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@nav.link.about">About</span>
			</a>
			<a
				routerLink="/contact/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center gap-4">
				<app-svg-icon
					icon="mail"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@nav.link.contact">Contact</span>
			</a>

			@let user = authService.currentUser();

			<!--  -->
			@if (user) {
			<a
				routerLink="/admin/"
				routerLinkActive="active"
				ariaCurrentWhenActive="page"
				class="flex flex-row items-center gap-4">
				<app-svg-icon
					icon="magGlass"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@nav.link.admin">Admin</span>
			</a>

			<button
				class="flex flex-row items-center gap-4"
				[disabled]="authService.isLoggingIn()"
				(click)="$event.stopPropagation(); handleLogout()">
				<app-svg-icon
					icon="person"
					width="24"
					height="24">
				</app-svg-icon>
				<span i18n="@@nav.link.logout">Logout</span>
			</button>
			}
		</nav>

		<div class="menu-footer flex flex-col">
			<app-language-select position="up"></app-language-select>
		</div>
	</aside>
</div>
}
