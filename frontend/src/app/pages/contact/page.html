<section class="page-contents flex flex-col items-center w-h-full">
	<article class="intro flex flex-col w-full layout-row gap-8">
		<h1
			i18n="@@contact.intro.title"
			class="text-center">
			Contact Me
		</h1>

		<p i18n="@@contact.intro.desc">
			Got a question, suggestion, or a project in mind? Whether you need to build a custom
			system from scratch or improve the accessibility of existing infrastructure, I am ready
			to help.
		</p>
	</article>

	<article class="options grid full-center layout-row w-full gap-20">
		<nav
			class="grid full-center gap-8"
			i18n-aria-label="@@contact.socials.nav.aria"
			aria-label="Social profiles and direct mail">
			@for (social of socials; track social.name) {
			<a
				[href]="social.url"
				target="_blank"
				rel="noopener noreferrer"
				[attr.aria-label]="social.ariaLabel"
				class="w-fit">
				<app-svg-icon
					[icon]="social.icon"
					[width]="socialIconSize()"
					[height]="socialIconSize()">
				</app-svg-icon>
			</a>
			}
		</nav>

		<form
			app-contact-form
			[formValues]="defaultValues"></form>
	</article>
</section>
