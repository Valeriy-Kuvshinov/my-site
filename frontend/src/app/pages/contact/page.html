<section class="page-contents flex flex-col items-center w-h-full">
	<article class="intro flex flex-col w-full layout-row gap-8">
		<h1 class="text-center">Contact Me</h1>

		<p>
			Got a question, suggestion, or a project in mind? Whether you need to build a custom
			system from scratch or improve the accessibility of existing infrastructure, I am ready
			to help.
		</p>
	</article>

	<article class="options grid full-center layout-row w-full gap-20">
		<nav
			class="grid full-center gap-4"
			aria-label="Social profiles and direct mail">
			<a
				href="https://www.linkedin.com/in/valeriy-kuvshin-ov/"
				target="_blank"
				rel="noopener noreferrer"
				aria-label="LinkedIn profile (opens in a new tab)"
				class="w-fit">
				<app-svg-icon
					icon="linkedin"
					[width]="socialIconSize()"
					[height]="socialIconSize()">
				</app-svg-icon>
			</a>
			<a
				href="https://github.com/Valeriy-Kuvshinov"
				target="_blank"
				rel="noopener noreferrer"
				aria-label="GitHub profile (opens in a new tab)"
				class="w-fit">
				<app-svg-icon
					icon="github"
					[width]="socialIconSize()"
					[height]="socialIconSize()">
				</app-svg-icon>
			</a>
			<a
				href="https://www.facebook.com/valery.kuvshinov.75/"
				target="_blank"
				rel="noopener noreferrer"
				aria-label="Facebook profile (opens in a new tab)"
				class="w-fit">
				<app-svg-icon
					icon="facebook"
					[width]="socialIconSize()"
					[height]="socialIconSize()">
				</app-svg-icon>
			</a>
			<a
				href="mailto:contact@kuvware.com"
				target="_blank"
				rel="noopener noreferrer"
				aria-label="Send an email directly"
				class="w-fit">
				<app-svg-icon
					icon="mail"
					[width]="socialIconSize()"
					[height]="socialIconSize()">
				</app-svg-icon>
			</a>
		</nav>

		<form
			app-contact-form
			[initialValues]="defaultFormValues"></form>
	</article>
</section>
