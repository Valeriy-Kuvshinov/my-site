<div
	[formGroup]="form"
	style="display: contents">
	@if (isFormBusy()) {
	<app-loading></app-loading>

	} @else {
	<app-input-area
		i18n-label="@@contact.form.name.label"
		label="Name"
		name="name"
		[required]="true"
		type="text"
		icon="person"
		i18n-placeholder="@@contact.form.name.placeholder"
		placeholder="Your name"
		[control]="getInputControl('name')"
		[error]="getErrorMessage('name')">
	</app-input-area>

	<app-input-area
		i18n-label="@@contact.form.email.label"
		label="Email"
		name="email"
		[required]="true"
		type="email"
		icon="mail"
		i18n-placeholder="@@contact.form.email.placeholder"
		placeholder="Your email"
		[control]="getInputControl('email')"
		[error]="getErrorMessage('email')">
	</app-input-area>

	<app-input-area
		i18n-label="@@contact.form.title.label"
		label="Title"
		name="title"
		[required]="true"
		type="text"
		icon="title"
		i18n-placeholder="@@contact.form.title.placeholder"
		placeholder="Asking about..."
		[control]="getInputControl('title')"
		[error]="getErrorMessage('title')">
	</app-input-area>

	<app-select-area
		i18n-label="@@contact.form.subject.label"
		label="Subject"
		name="requestType"
		icon="info"
		[control]="getInputControl('requestType')"
		[error]="getErrorMessage('requestType')">
		<option
			value="Q&A"
			i18n="@@contact.form.subject.opt_qa">
			Q&A
		</option>
		<option
			value="Suggestion"
			i18n="@@contact.form.subject.opt_suggestion">
			Suggestion
		</option>
		<option
			value="Bug Report"
			i18n="@@contact.form.subject.opt_bug">
			Bug Report
		</option>
		<option
			value="Volunteering"
			i18n="@@contact.form.subject.opt_volunteer">
			Volunteering
		</option>
		<option
			value="Accessibility"
			i18n="@@contact.form.subject.opt_a11y">
			Accessibility
		</option>
		<option
			value="Other"
			i18n="@@contact.form.subject.opt_other">
			Other
		</option>
	</app-select-area>

	<app-input-area
		i18n-label="@@contact.form.message.label"
		label="Message"
		name="message"
		[required]="true"
		type="textarea"
		icon="message"
		i18n-placeholder="@@contact.form.message.placeholder"
		placeholder="Let's build a system..."
		[control]="getInputControl('message')"
		[error]="getErrorMessage('message')">
	</app-input-area>

	<div class="consent-wrapper flex flex-col gap-2 w-full">
		<label class="flex flex-row items-center gap-2">
			<input
				type="checkbox"
				formControlName="consent"
				class="w-h-fit"
				[attr.aria-invalid]="getInputControl('consent').invalid && getInputControl('consent').touched" />
			<span i18n="@@contact.form.consent.text">
				I agree to the
				<a
					routerLink="/terms"
					(click)="$event.stopPropagation()">
					Terms of Service
				</a>
				and the processing of my data in accordance with the
				<a
					routerLink="/privacy-policy"
					(click)="$event.stopPropagation()">
					Privacy Policy </a
				>.
			</span>
		</label>
		@if (getInputControl('consent').invalid && getInputControl('consent').touched) {
		<span
			i18n="@@contact.form.consent.error"
			class="error-text">
			You must accept the Terms of Service and Privacy Policy to submit form.
		</span>
		}
	</div>

	<section class="form-actions flex flex-row items-center justify-between">
		<button
			class="flex flex-row items-center gap-2 fast-trans"
			type="submit"
			[disabled]="isSendDisabled"
			(mouseenter)="isActiveInteract.set(true)"
			(mouseleave)="isActiveInteract.set(false)"
			(focus)="isActiveInteract.set(true)"
			(blur)="isActiveInteract.set(false)">
			<span i18n="@@contact.form.btn.send">Send</span>

			<app-svg-icon
				[icon]="buttonIcon"
				width="32"
				height="32">
			</app-svg-icon>
		</button>
	</section>
	}

	<ngx-turnstile
		[siteKey]="TURNSTILE_KEY"
		(resolved)="onTurnstileResolved($event)"
		(errored)="onTurnstileInvalid()"
		(expired)="onTurnstileInvalid()">
	</ngx-turnstile>
</div>
