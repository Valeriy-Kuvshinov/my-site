<form
	[formGroup]="form"
	class="grid layout-row w-full gap-4"
	(ngSubmit)="onSubmit()">
	<app-input-area
		label="Name"
		name="name"
		[required]="true"
		type="text"
		icon="person"
		placeholder="Your name"
		[control]="getInputControl('name')"
		[error]="getErrorMessage('name')">
	</app-input-area>

	<app-input-area
		label="Email"
		name="email"
		[required]="true"
		type="email"
		icon="mail"
		placeholder="Your email"
		[control]="getInputControl('email')"
		[error]="getErrorMessage('email')">
	</app-input-area>

	<app-input-area
		label="Title"
		name="title"
		[required]="true"
		type="text"
		icon="title"
		placeholder="Asking about..."
		[control]="getInputControl('title')"
		[error]="getErrorMessage('title')">
	</app-input-area>

	<app-select-area
		label="Subject"
		name="requestType"
		icon="info"
		[control]="getInputControl('requestType')"
		[error]="getErrorMessage('requestType')">
		<option value="Q&A">Q&A</option>
		<option value="Suggestion">Suggestion</option>
		<option value="Bug Report">Bug Report</option>
		<option value="Volunteering">Volunteering</option>
		<option value="Accessibility">Accessibility</option>
		<option value="Other">Other</option>
	</app-select-area>

	<app-input-area
		label="Message"
		name="message"
		[required]="true"
		type="textarea"
		icon="message"
		placeholder="Yo, I got a question..."
		[control]="getInputControl('message')"
		[error]="getErrorMessage('message')">
	</app-input-area>

	<section class="form-actions flex flex-row items-center justify-between">
		<button
			class="flex flex-row items-center gap-2"
			type="submit"
			[disabled]="isSendDisabled"
			(mouseenter)="isActiveInteract.set(true)"
			(mouseleave)="isActiveInteract.set(false)"
			(focus)="isActiveInteract.set(true)"
			(blur)="isActiveInteract.set(false)">
			<span>
				@if (isProcessing() || sendMailMutation.isPending()) { Sending... } @else { Send }
			</span>
			<app-svg-icon
				[icon]="buttonIcon"
				width="32"
				height="32">
			</app-svg-icon>
		</button>
	</section>
	<ngx-turnstile
		[siteKey]="TURNSTILE_KEY"
		(resolved)="onTurnstileResolved($event)"
		(errored)="onTurnstileInvalid()"
		(expired)="onTurnstileInvalid()">
	</ngx-turnstile>
</form>
