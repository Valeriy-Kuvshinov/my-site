<div class="carousel-track flex flex-row items-center gap-8">
	<ul class="flex flex-row items-center gap-8">
		@for (icon of techIcons; track icon.name) {
		<li>
			<span class="sr-only">{{ icon.label }}</span>
			<app-svg-icon
				[icon]="icon.name"
				[width]="iconSize()"
				[height]="iconSize()">
			</app-svg-icon>
		</li>
		}
	</ul>
	<!-- Duplicated Set for Seamless Looping -->
	<ul
		class="flex flex-row items-center gap-8"
		aria-hidden="true">
		@for (icon of techIcons; track icon.name) {
		<li>
			<app-svg-icon
				[icon]="icon.name"
				[width]="iconSize()"
				[height]="iconSize()">
			</app-svg-icon>
		</li>
		}
	</ul>
</div>
