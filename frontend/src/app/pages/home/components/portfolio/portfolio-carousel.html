<div
	class="viewport relative layout-row w-full"
	aria-roledescription="carousel">
	<ul
		class="track flex flex-row fast-trans relative"
		[style.transform]="transformStyle()">
		@for (slide of slides; track slide.title; let i = $index) {
		<li
			class="slide grid w-full"
			aria-roledescription="slide"
			[attr.aria-hidden]="currentIdx() !== i">
			<div class="visual relative w-full layout-row">
				<button
					class="flex full-center fast-trans absolute z-1"
					i18n-aria-label="@@home.portfolio.btn.prev"
					aria-label="Previous accomplishment"
					[disabled]="isFirstSlide()"
					[tabIndex]="currentIdx() === i ? 0 : -1"
					(click)="prevSlide()">
					<app-svg-icon
						icon="arrow"
						[width]="iconSize()"
						[height]="iconSize()">
					</app-svg-icon>
				</button>

				<app-image-container
					[src]="getPortfolioImageSrc(slide, isMobile())"
					[alt]="slide.imgAlt"
					[style.aspect-ratio]="getPortfolioImageRatio(slide, isMobile())"
					class="cursor-pointer"
					role="button"
					[tabIndex]="currentIdx() === i ? 0 : -1"
					[attr.aria-label]="getImageAriaLabel(slide)"
					(onClickEvent)="openImage(getPortfolioImageSrc(slide, isMobile()))">
				</app-image-container>

				<button
					class="flex full-center fast-trans absolute z-1"
					i18n-aria-label="@@home.portfolio.btn.next"
					aria-label="Next accomplishment"
					[disabled]="isLastSlide()"
					[tabIndex]="currentIdx() === i ? 0 : -1"
					(click)="nextSlide()">
					<app-svg-icon
						icon="arrow"
						[width]="iconSize()"
						[height]="iconSize()">
					</app-svg-icon>
				</button>
			</div>

			<div class="content flex flex-col justify-center gap-4">
				<h3 class="text-center">{{ slide.title }}</h3>

				<p class="text-center w-full">{{ slide.description }}</p>

				@if (slide.technologies && slide.technologies.length > 0) {
				<ul
					class="flex flex-row flex-wrap gap-2 w-full"
					i18n-aria-label="@@home.portfolio.tech.aria"
					aria-label="Technologies used">
					@for (tech of slide.technologies; track tech) {
					<li class="w-h-fit">{{ tech }}</li>
					}
				</ul>
				}
			</div>
		</li>
		}
	</ul>
</div>
