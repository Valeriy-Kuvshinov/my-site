<button
	class="flex full-center fast-trans absolute z-1"
	aria-label="Previous accomplishment"
	[disabled]="isFirstSlide()"
	(click)="prevSlide()">
	<app-svg-icon
		icon="arrow"
		width="32"
		height="32">
	</app-svg-icon>
</button>

<div
	class="viewport relative overflow-hidden w-full"
	aria-roledescription="carousel">
	<ul
		class="track flex flex-row fast-trans"
		[style.transform]="transformStyle()">
		@for (slide of slides; track slide.title) {
		<li
			class="slide flex flex-col items-center gap-4 w-full shrink-0"
			aria-roledescription="slide">
			<app-image-container
				[src]="slide.imgSrc"
				[alt]="slide.imgAlt"
				[width]="640"
				[height]="360"
				[priority]="false">
			</app-image-container>
			<h3 class="text-center">{{ slide.title }}</h3>
			<p class="text-center w-full max-w-3xl">{{ slide.description }}</p>
		</li>
		}
	</ul>
</div>

<button
	class="flex full-center fast-trans absolute z-1"
	aria-label="Next accomplishment"
	[disabled]="isLastSlide()"
	(click)="nextSlide()">
	<app-svg-icon
		icon="arrow"
		width="32"
		height="32">
	</app-svg-icon>
</button>
